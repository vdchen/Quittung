name: Python Tests and Coverage

on:
  push:
    branches: [ dev, main ]
  pull_request:
    branches: [ dev, main ]

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff check
        run: ruff check app/ tests/

  test:
    name: Tests & Coverage
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create .env.test file
        run: |
          echo "ENVIRONMENT=testing" > .env.test
          echo "PROJECT_NAME=quittung" >> .env.test
          echo "SECRET_KEY=test_secret_key_change_me" >> .env.test
          echo "POSTGRES_USER=postgres" >> .env.test
          echo "POSTGRES_PASSWORD=postgres" >> .env.test
          echo "POSTGRES_DB=quittung_test_db" >> .env.test
          echo "DB_PORT=5432" >> .env.test
          echo "REDIS_PORT=6379" >> .env.test

          # Internal Docker network URLs
          echo "DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/quittung_test_db" >> .env.test
          echo "REDIS_URL=redis://redis:6379/0" >> .env.test

          # Optional secrets (from GitHub Secrets)
          echo "GOOGLE_API_KEY=${{ secrets.GOOGLE_API_KEY }}" >> .env.test
          echo "TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}" >> .env.test
          echo "TELEGRAM_WEBHOOK_SECRET=ci-test-webhook-secret" >> .env.test
          echo "API_KEY=test-api-key-789" >> .env.test

      - name: Run tests in Docker
        env:
          ENVIRONMENT: testing
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          DATABASE_URL: "postgresql+asyncpg://postgres:postgres@db:5432/quittung_test_db"
          REDIS_URL: "redis://redis:6379/0"
        run: |
          # The database creation is handled automatically by app code
          # in migrations/env.py and tests/conftest.py.
          ENV_FILE=.env.test docker compose -p quittung run --rm api \
            pytest --cov=app --cov-report=xml --cov-report=term-missing --cov-fail-under=70

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          fail_ci_if_error: false