name: Python Tests and Coverage

on:
  push:
    branches: [ dev, main ]
  pull_request:
    branches: [ dev, main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create .env.test file
        run: |
          # Use default values for Docker Compose interpolation to stop the warnings
          echo "PROJECT_NAME=quittung" >> .env.test
          echo "POSTGRES_USER=postgres" >> .env.test
          echo "POSTGRES_PASSWORD=postgres" >> .env.test
          echo "POSTGRES_DB=quittung_test_db" >> .env.test
          echo "DB_PORT=5432" >> .env.test
          echo "REDIS_PORT=6379" >> .env.test
          
          # Inject actual secrets from GitHub
          echo "DATABASE_URL=${{ secrets.TEST_DATABASE_URL }}" >> .env.test
          echo "REDIS_URL=${{ secrets.TEST_REDIS_URL }}" >> .env.test
          echo "GOOGLE_API_KEY=${{ secrets.GOOGLE_API_KEY }}" >> .env.test
          echo "TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}" >> .env.test

      - name: Run tests in Docker
        env:
          PROJECT_NAME: quittung
          DATABASE_URL: "postgresql+asyncpg://postgres:postgres@db:5432/quittung_test_db"
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          API_V1_PREFIX: "/api/v1"
        run: |
          docker compose -p quittung run \
            -e PROJECT_NAME=$PROJECT_NAME \
            -e DATABASE_URL=$DATABASE_URL \
            -e GOOGLE_API_KEY=$GOOGLE_API_KEY \
            -e API_V1_PREFIX=$API_V1_PREFIX \
            --rm api pytest --cov=app --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          fail_ci_if_error: false