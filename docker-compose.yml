services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-quittung_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-quittung_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - quittung_network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - quittung_network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  migrations:
    build: .
    command: alembic upgrade head
    env_file:
      - ${ENV_FILE:-.env}
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL
      - REDIS_URL
    networks:
      - quittung_network

  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    volumes:
      - uploads_data:/app/uploads 
    env_file:
      - ${ENV_FILE:-.env}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    environment:
      - DATABASE_URL
      - REDIS_URL
    restart: unless-stopped
    networks:
      - quittung_network

  worker:
    build: .
    command: celery -A app.core.celery_app worker --loglevel=info
    volumes:
      - uploads_data:/app/uploads
    env_file:
      - ${ENV_FILE:-.env}
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    environment:
      - DATABASE_URL
      - REDIS_URL
    restart: unless-stopped
    networks:
      - quittung_network

  beat:
    build: .
    command: celery -A app.core.celery_app beat --loglevel=info
    env_file:
      - ${ENV_FILE:-.env}
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    environment:
      - DATABASE_URL
      - REDIS_URL
    restart: unless-stopped
    networks:
      - quittung_network

networks:
  quittung_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  uploads_data: