[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
; Session-scoped loop is required so that the session-scoped setup_db
; fixture shares one event loop with all tests.
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
filterwarnings =
    ignore::DeprecationWarning
addopts =
    -v
    --strict-markers
    --tb=short
    --disable-warnings

; pytest-dotenv: load .env.test into os.environ before any imports fire.
; This ensures ENVIRONMENT=testing reaches config.py at module load time.
env_file = .env.test

markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests

[coverage:run]
source = app
omit =
    */tests/*
    */conftest.py
    */__init__.py

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

[coverage:html]
directory = htmlcov